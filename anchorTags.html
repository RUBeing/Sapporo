<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tags</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    

    <div class="d-flex gap-1">
        <a href="index.html" class="btn btn-primary btn-lg" >Book your trip now</a>
        <a href="#" class="btn btn-secondary" >Add another person to your trip</a>
        <a href="#" class="btn btn-outline-primary btn-sm" >Add a car</a>
        <a href="#" class="btn btn-danger" >Cancel and stay home</a>
    </div>

    <div class="input-group">
        <span class="input-group-text">Email</span>
        <input placeholder="Please enter your email address." type="email text" class="form-control" id="email" >
    </div>    
    <div class="input-group">  
        <span class="input-group-text">Password</span>
        <input placeholder="Please enter your password." type="password" class="form-control" id="password" >
    </div>
    <div>
        <button class="btn btn-primary" type="button">Subscribe</button> 
    </div>
   
    <!-- This imports a script file from another location. In this case, from the internet. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>    
</body>
</html>
