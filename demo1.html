<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .avatar {
            background-color: red;
            width: 90px;
            height: 90px;
            border-radius: 7%;
        }

        .card {
            background-color: lightblue;
            width: 200px;
            padding: 20px;
            border: 4px solid navy;
            border-radius: 6px;
            margin: 5px;
        }

        .card2 {
            background-color: lightblue;
            width: 200px;
            padding: 20px;
            border-top: 6px solid navy;
            border-bottom: 2px solid navy;
            border-radius: 6px;
            margin-top: -25px;
            margin-left: 35px;
        }

    </style>

</head>
<body>

    <div class="avatar"> This is my avatar card </div>
    <div class="card"> This is my card </div>
    <div class="card2"> This is my card </div>

</body>
</html>
